name: photo-vault

# 只挂载「一个」父目录，是 link（硬链接）模式能工作的前提。
# Docker 里每个 bind mount 都是独立设备，素材和 vault 分开挂载 → 硬链接会报 EXDEV。
#
# 推荐布局（宿主机）：
#   D:\photo\            ← HOST_ROOT
#       ├── vault\       ← 内容寻址库（本系统写入）
#       ├── derived\     ← 缩略图/代理（可随时删，会重建）
#       └── source\      ← 你现有的相册（原样不动）
#
# 这样素材与 vault 在同一个挂载点里，硬链接可用：不额外占空间、秒级入库。

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vault}
      POSTGRES_DB: ${POSTGRES_DB:-vault}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 宿主机 5432 常被占用，这里避让
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vault} -d ${POSTGRES_DB:-vault}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      # Dockerfile 里 app / worker 两个最终阶段；这里只构建 app 目标
      target: app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD:-vault}@db:5432/${POSTGRES_DB:-vault}
      VAULT_ROOT: /host/vault
      DERIVED_ROOT: /host/derived
      LANDING_ROOT: /host/vault/.landing
      # 只用来"生成给人/给剪辑软件看的路径"（出稿目录要交给资源管理器），
      # 落盘一律走 /host。不设也能跑，只是接口返回容器内路径。
      HOST_PATH_ROOT: ${HOST_ROOT:-./host}
      # 影视库不进 vault：只登记路径。电影/剧集放在 MEDIA_HOST_ROOT，
      # 容器里挂成 /media，库中存相对路径，换盘只改 env。
      MEDIA_ROOT: /media
      MEDIA_HOST_ROOT: ${MEDIA_HOST_ROOT:-./media}
      DEFAULT_TZ_OFFSET_MIN: ${DEFAULT_TZ_OFFSET_MIN:-480}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${APP_PORT:-7878}:7878"
    volumes:
      # 唯一的业务挂载点。必须是本地固定盘：
      # SMB/UNC 网络盘无法可靠 bind-mount（WSL2 限制），且不支持硬链接。
      - ${HOST_ROOT:-./host}:/host
      # 影视库独立挂载：和 vault 同一个盘会形成嵌套挂载，Docker 允许；
      # 放在另一块盘（D:\Movies）也完全可以 —— 影视不需要硬链接。
      - ${MEDIA_HOST_ROOT:-./media}:/media

  # ML worker：人脸识别 / RAM++ 打标 / 视频摘要，随 compose 一起常驻。
  # 与 app 共用 /host 挂载（同样的 vault / derived 内容），模型权重从宿主机
  # models/ 只读挂载复用（缺权重会自动下载到挂载目录，宿主机也能用）。
  # llama.cpp / qwen3-vl 的视频模型是 Windows 版、没挂进容器 → video 任务自动跳过，
  # 视频摘要仍由宿主机 worker 跑（uv run --group ml python -m ml.worker --task video）。
  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD:-vault}@db:5432/${POSTGRES_DB:-vault}
      VAULT_ROOT: /host/vault
      DERIVED_ROOT: /host/derived
      VAULT_MODELS_DIR: /models
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${HOST_ROOT:-./host}:/host
      # 权重只读挂载：insightface 人脸模型 + RAM++ 打标权重
      - ./models/insightface:/models/insightface:ro
      - ./models/ram_plus_int8.onnx:/models/ram_plus_int8.onnx:ro
    # 有 NVIDIA GPU 且 Docker Desktop（WSL2）已配好 GPU 时，去掉下面的注释走 GPU：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  pgdata:
