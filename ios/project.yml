# Photo Vault iOS —— XcodeGen 工程描述。
#
# 仓库里不提交 .xcodeproj（生成物、容易冲突），改工程设置改这里：
#   cd ios && xcodegen generate
#
# 打开工程：
#   open ios/PhotoVaultSync.xcodeproj
name: PhotoVaultSync

options:
  bundleIdPrefix: com.photovault
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  PhotoVaultSync:
    type: application
    platform: iOS
    sources:
      - path: PhotoVaultSync
    info:
      # 由 XcodeGen 生成，改 Info.plist 改这里（生成后不要再手改产物）
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 相册同步
        CFBundleName: PhotoVaultSync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # SwiftUI 自己管场景，不需要 UIApplicationSceneManifest
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
        # ---- 照片库 ----
        NSPhotoLibraryUsageDescription: 需要读取照片库，把照片和视频备份到家里的 Photo Vault 服务器。
        NSPhotoLibraryAddUsageDescription: 需要把下载的照片存回照片库时使用。
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        # ---- 局域网明文 HTTP ----
        # 家里服务器是 http://bmc_desktop:7878，没有 HTTPS。
        # NSAllowsLocalNetworking 只放行局域网/未限定域名（.local、单段主机名、私有 IP），
        # 不是 NSAllowsArbitraryLoads，公网 HTTP 仍然被 ATS 拦住。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # iOS 14+ 连局域网点第一次会弹「本地网络」权限；这句是弹窗里的说明。
        NSLocalNetworkUsageDescription: 需要连接局域网里的 Photo Vault 服务器（如 bmc_desktop:7878）来同步相册。
        NSBonjourServices:
          - _http._tcp
        # ---- 后台同步 ----
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.photovault.ios.sync
          - com.photovault.ios.refresh
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photovault.ios
        PRODUCT_NAME: PhotoVaultSync
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # 真机安装时：xcodebuild DEVELOPMENT_TEAM=<你的TeamID>，或在这里填死。
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

  PhotoVaultSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PhotoVaultSyncTests
    dependencies:
      - target: PhotoVaultSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photovault.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhotoVaultSync.app/PhotoVaultSync"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PhotoVaultSync:
    build:
      targets:
        PhotoVaultSync: all
        PhotoVaultSyncTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: PhotoVaultSyncTests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
